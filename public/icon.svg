<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="StudySphere">
  <title>StudySphere</title>

  <!--
    Three arcs of a sphere on deep navy. No gradient and no outline: flat ground,
    solid strokes, nothing else, which is what keeps it legible down to 16px in a
    browser tab.

    Rounded corners here because this is the favicon. The PNGs are square and
    opaque - iOS and Android both apply their own mask to home screen icons, and
    a pre-rounded PNG gets rounded twice, with its transparent corners rendering
    black on some versions.
  -->
  <rect width="512" height="512" rx="112" fill="#111a2e"/>

  <g fill="none" stroke="#f2efe4" stroke-width="46" stroke-linecap="round">
    <path d="M126 190 A 168 168 0 0 1 386 190"/>
    <path d="M150 300 A 132 132 0 0 0 362 300"/>
    <path d="M198 388 A 88 88 0 0 0 314 388"/>
  </g>
</svg>
